name: Email - manifest updates today

on:
  push:
    paths:
      - "manifest.json"
  schedule:
    # codziennie 07:05 czasu UTC (w PL zimą = 08:05, latem = 09:05)
    - cron: "5 7 * * *"
  workflow_dispatch: {}

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout

            - name: DEBUG - workflow is running
        run: |
          echo "Workflow started OK"
          echo "UTC now: $(date -u)"
          echo "Warsaw now: $(TZ=Europe/Warsaw date)"
          echo "Files in repo root:"
          ls -la
          echo "manifest.json preview:"
          head -n 20 manifest.json || true
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm i nodemailer

      - name: Send email if manifest has today's updates
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }} # np. "a@x.pl,b@y.pl"
          BASE_URL: ${{ secrets.BASE_URL }} # np. "https://raporty.ace-group.pl/"
          TZ: "Europe/Warsaw"
        run: node .github/scripts/send_manifest_today.js
