name: Notify when manifest has today's updates

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute updates list
        id: updates
        run: |
          TODAY=$(TZ="Europe/Warsaw" date +%Y-%m-%d)
          echo "TODAY=$TODAY"

          UPDATES=$(python3 -c "import json; d=json.load(open('manifest.json','r',encoding='utf-8')); t='$TODAY'; print('\n'.join([(v.get('name') or k) for k,v in d.items() if isinstance(v,dict) and v.get('updated')==t]))")
          echo "UPDATES<<EOF" >> $GITHUB_ENV
          echo "$UPDATES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ -z "$UPDATES" ]; then
            echo "HAS_UPDATES=false" >> $GITHUB_ENV
          else
            echo "HAS_UPDATES=true" >> $GITHUB_ENV
          fi

      - name: Send email via SMTP
        if: env.HAS_UPDATES == 'true'
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: |
          python3 -c "import os,smtplib; from email.mime.text import MIMEText; s=os.environ['SMTP_SERVER']; p=int(os.environ['SMTP_PORT']); u=os.environ['SMTP_USERNAME']; pw=os.environ['SMTP_PASSWORD']; r=[x.strip() for x in os.environ['RECIPIENTS'].split(',') if x.strip()]; updates=os.environ.get('UPDATES','').strip(); subj='Nowy raport na platformie ACE'; body=f\"Nowy raport dostępny w ACE:\\n\\n{updates}\\n\\nPojawił się na platformie:\\nhttps://raporty.ace-group.pl\\n\\nPozdrawiamy,\\nACE – Agri Commodity Experts\\n\"; msg=MIMEText(body,_charset='utf-8'); msg['Subject']=subj; msg['From']=u; msg['To']=', '.join(r); srv=smtplib.SMTP_SSL(s,p,timeout=30); srv.login(u,pw); srv.sendmail(u,r,msg.as_string()); srv.quit(); print('Sent to:', r)"
