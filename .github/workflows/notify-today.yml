name: Notify when manifest has today's updates

on:
  push:
    branches:
      - main
    paths:
      - manifest.json

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check manifest for today's updates
        id: check
        run: |
          TODAY=$(TZ="Europe/Warsaw" date +%Y-%m-%d)
          UPDATES=$(jq -r --arg today "$TODAY" '
            to_entries[] | select(.value.updated == $today) | .value.name
          ' manifest.json)

          if [ -z "$UPDATES" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "updates<<EOF" >> $GITHUB_OUTPUT
            echo "$UPDATES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Send email via SMTP
        if: steps.check.outputs.has_updates == 'true'
        run: |
          python3 <<EOF
          import smtplib
          from email.mime.text import MIMEText
          import os

          smtp_server = os.environ["SMTP_SERVER"]
          smtp_port = int(os.environ["SMTP_PORT"])
          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          recipients = os.environ["RECIPIENTS"].split(",")

          updates = """${{ steps.check.outputs.updates }}"""

          body = f"""Nowy raport dostępny w ACE:

{updates}

Pojawił się na platformie:
https://raporty.ace-group.pl

Pozdrawiamy,
ACE – Agri Commodity Experts
"""

          msg = MIMEText(body)
          msg["Subject"] = "Nowy raport na platformie ACE"
          msg["From"] = username
          msg["To"] = ", ".join(recipients)

          with smtplib.SMTP_SSL(smtp_server, smtp_port) as server:
              server.login(username, password)
              server.sendmail(username, recipients, msg.as_string())
          EOF

        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
