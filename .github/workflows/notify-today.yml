name: Notify when manifest has today's updates

on:
  push:
    branches:
      - main
    paths:
      - manifest.json
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check manifest and send email if needed
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: |
          set -e

          TODAY=$(TZ="Europe/Warsaw" date +%Y-%m-%d)
          echo "TODAY=$TODAY"

          UPDATES=$(python3 - <<PY
import json
today = "$TODAY"
with open("manifest.json", "r", encoding="utf-8") as f:
    data = json.load(f)

names = []
for k, v in data.items():
    if isinstance(v, dict) and v.get("updated") == today:
        names.append(v.get("name") or k)

print("\n".join(names))
PY
          )

          if [ -z "$UPDATES" ]; then
            echo "No updates today. Email not sent."
            exit 0
          fi

          python3 - <<PY
import os, smtplib
from email.mime.text import MIMEText

smtp_server = os.environ["SMTP_SERVER"]
smtp_port   = int(os.environ["SMTP_PORT"])
username    = os.environ["SMTP_USERNAME"]
password    = os.environ["SMTP_PASSWORD"]
recipients  = [r.strip() for r in os.environ["RECIPIENTS"].split(",") if r.strip()]

updates = """$UPDATES"""

subject = "Nowy raport na platformie ACE"
body = f"""Nowy raport dostępny w ACE:

{updates}

Pojawił się na platformie:
https://raporty.ace-group.pl

Pozdrawiamy,
ACE – Agri Commodity Experts
"""

msg = MIMEText(body, _charset="utf-8")
msg["Subject"] = subject
msg["From"] = username
msg["To"] = ", ".join(recipients)

with smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=30) as server:
    server.login(username, password)
    server.sendmail(username, recipients, msg.as_string())

print("Sent to:", recipients)
PY
