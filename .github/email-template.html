<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ACE Raporty</title>
</head>
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:30px 0;">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,0.05);">

          <!-- HEADER -->
          <tr>
            <td style="background:#0b1220;padding:20px;text-align:center;">
              <img src="https://raporty.ace-group.pl/logo.png" width="120" alt="ACE">
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:30px;">

              <h2 style="margin:0 0 15px 0;color:#0b1220;">
                📊 Nowe raporty ACE
              </h2>

              <p style="margin:0 0 20px 0;color:#333;font-size:14px;">
                Zaktualizowane dziś (<strong>{{DATE}}</strong>):
              </p>

              <div style="font-size:14px;color:#333;line-height:1.6;">
                {{CONTENT}}
              </div>

              <div style="margin-top:30px;text-align:center;">
                <a href="https://raporty.ace-group.pl"
                   style="display:inline-block;background:#0b1220;color:#ffffff;
                          padding:10px 18px;text-decoration:none;border-radius:5px;font-size:14px;">
                  Przejdź do panelu raportów
                </a>
              </div>

            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background:#f0f2f7;padding:15px;text-align:center;font-size:12px;color:#666;">
              ACE – Agri Commodity Experts<br>
              Automatyczne powiadomienie systemowe
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
